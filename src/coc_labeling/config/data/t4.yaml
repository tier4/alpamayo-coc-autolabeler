defaults:
  - base
  - _self_

# TIER IV T4 scenes. Paths are site-specific and are expected to be supplied on
# the command line; only the shape of the T4 run is fixed here.
#
# video_dir points at the T4 dataset root, because a T4 clip id is its scene
# directory flattened by meta_action.t4_labeling.clip_id_for. For example
# clip id prd_jt__<uuid>__<date>__<scene> resolves to
# <video_dir>/prd_jt/<uuid>/<date>/<scene>/data/CAM_FRONT.mp4.
segment_config_path: null # keyframe_auto_select.py output, segments_relative_timestamp_sampled.json
video_dir: null # T4 dataset root, for example /path/to/t4_dataset
meta_action_dir: null # post_processing.py output dir holding <clip_id>.txt

# T4 exposes no trajdata parquet or cache, so the vector loader stays off and
# these remain unused.
segment_list_parquet_file: null
data_dir: null
cache_dir: null
